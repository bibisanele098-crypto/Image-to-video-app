<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Image to Video</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --text: #16181c;
    --text-dim: #6b7280;
    --accent: #5b5bf0;
    --accent-text: #ffffff;
    --border: #e3e5ea;
    --track: #e3e5ea;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101114;
      --surface: #1a1c21;
      --text: #f2f3f5;
      --text-dim: #9aa0aa;
      --accent: #8b8bff;
      --accent-text: #0e0e12;
      --border: #2b2e35;
      --track: #2b2e35;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101114;
    --surface: #1a1c21;
    --text: #f2f3f5;
    --text-dim: #9aa0aa;
    --accent: #8b8bff;
    --accent-text: #0e0e12;
    --border: #2b2e35;
    --track: #2b2e35;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px calc(32px + env(safe-area-inset-bottom, 0px));
    display: flex;
    justify-content: center;
  }
  .card { width: 100%; max-width: 480px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--text-dim); font-size: 0.9rem; margin: 0 0 20px; }
  .section { margin-bottom: 20px; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; }
  .drop {
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 24px 12px;
    text-align: center;
    color: var(--text-dim);
    cursor: pointer;
    background: var(--surface);
    transition: border-color .15s;
    overflow: hidden;
  }
  .drop:hover { border-color: var(--accent); }
  .drop img { max-width: 100%; max-height: 220px; border-radius: 10px; display: block; margin: 0 auto; }
  input[type=file] { display: none; }
  textarea {
    width: 100%;
    min-height: 80px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    background: var(--surface);
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
  }
  textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .row span.val { color: var(--accent); font-weight: 700; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.95rem;
  }
  button#gen {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  button#gen:disabled { opacity: 0.6; cursor: default; }
  .result {
    margin-top: 20px;
    padding: 16px;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: none;
  }
  .result.show { display: block; }
  .spinner {
    width: 22px; height: 22px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .note { font-size: 0.8rem; color: var(--text-dim); line-height: 1.4; }
</style>
</head>
<body>
<div class="card">
  <h1>Image → Video</h1>
  <p class="sub">Upload an image, describe the motion, pick duration &amp; scale.</p>

  <div class="section">
    <label>Source image</label>
    <div class="drop" id="drop">
      <div id="dropText">Tap to upload an image</div>
    </div>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="section">
    <label for="prompt">Prompt</label>
    <textarea id="prompt" placeholder="e.g. the waves slowly rise and the clouds drift across the sky"></textarea>
  </div>

  <div class="section">
    <div class="row"><label style="margin:0">Duration</label><span class="val" id="durVal">8s</span></div>
    <input type="range" id="duration" min="1" max="30" value="8" step="1">
  </div>

  <div class="section">
    <label for="scale">Scale / quality</label>
    <select id="scale">
      <option value="480p">480p (fast)</option>
      <option value="720p" selected>720p (balanced)</option>
      <option value="1080p">1080p (high quality)</option>
    </select>
  </div>

  <button id="gen">Generate video</button>

  <div class="result" id="result"></div>
</div>

<script>
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('fileInput');
  const duration = document.getElementById('duration');
  const durVal = document.getElementById('durVal');
  const genBtn = document.getElementById('gen');
  const result = document.getElementById('result');
  let selectedFile = null;

  drop.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    selectedFile = file;
    const reader = new FileReader();
    reader.onload = e => {
      drop.innerHTML = '';
      const img = document.createElement('img');
      img.src = e.target.result;
      drop.appendChild(img);
    };
    reader.readAsDataURL(file);
  });

  duration.addEventListener('input', () => {
    durVal.textContent = duration.value + 's';
  });

  async function pollStatus(taskId) {
    while (true) {
      await new Promise(r => setTimeout(r, 4000));
      const res = await fetch('/api/status/' + taskId);
      const data = await res.json();
      if (data.status === 'done') return data.videoUrl;
      if (data.status === 'failed') throw new Error(data.reason || 'Generation failed');
    }
  }

  genBtn.addEventListener('click', async () => {
    const prompt = document.getElementById('prompt').value.trim();
    if (!selectedFile) { alert('Please upload an image first.'); return; }
    if (!prompt) { alert('Please enter a prompt.'); return; }

    const dur = duration.value;
    const scale = document.getElementById('scale').value;

    genBtn.disabled = true;
    genBtn.textContent = 'Generating…';
    result.classList.add('show');
    result.innerHTML = '<div class="spinner"></div><p style="text-align:center;margin:0;color:var(--text-dim)">Sending to Kling AI…</p>';

    try {
      const form = new FormData();
      form.append('image', selectedFile);
      form.append('prompt', prompt);
      form.append('duration', dur);
      form.append('scale', scale);

      const startRes = await fetch('/api/generate', { method: 'POST', body: form });
      const startData = await startRes.json();
      if (!startRes.ok) throw new Error(startData.error || 'Failed to start generation');

      result.innerHTML = '<div class="spinner"></div><p style="text-align:center;margin:0;color:var(--text-dim)">Rendering your video… this can take a minute or two.</p>';
      const videoUrl = await pollStatus(startData.taskId);

      result.innerHTML =
        '<video src="' + videoUrl + '" controls style="width:100%;border-radius:10px;margin-bottom:10px;"></video>' +
        '<p class="note">Prompt: "' + prompt.replace(/</g,'&lt;') + '"<br>Duration: ' + dur + 's · Scale: ' + scale + '</p>';
    } catch (err) {
      result.innerHTML = '<p class="note" style="color:#e05252">Something went wrong: ' + err.message.replace(/</g,'&lt;') + '</p>';
    } finally {
      genBtn.disabled = false;
      genBtn.textContent = 'Generate video';
    }
  });
</script>
</body>
</html>
